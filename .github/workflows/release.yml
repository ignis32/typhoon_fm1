# Releases are built on GitHub, not by hand: The Firmware Hub's shared workflow zvenson/fm1-build (at its reviewed
# tag v1) checks out this commit, builds it with JieLi's toolchain and the AC79 SDK, runs the tests, signs a build
# attestation for the package and, on a tag, publishes it as that tag's release (pages.yml then puts it on the site).
# Check a file yourself with
#   gh attestation verify typhoon_fm1-X.Y.fwsc --repo ignis32/typhoon_fm1 \
#       --signer-workflow zvenson/fm1-build/.github/workflows/build.yml
#   push a tag vX.Y (X.Y == the VERSION file)  -> build, test, attest, release
#   workflow_dispatch                           -> build, test, attest only (no release)
# Never add or replace a release file by hand: only the attested files get the hub's key.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  firmware:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      build: |
        set -euo pipefail
        test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
        if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$(cat VERSION)"; fi
        sh build.sh --release "$(cat VERSION)"
      test: sh tools/test.sh
      packages: build/typhoon_fm1-*.fwsc
